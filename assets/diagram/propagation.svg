<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 476" width="820" height="476" role="img" aria-label="How a self-replicating payload travels between AI agents">
<title>Agent Wormhole — how a payload travels between agents</title>
<desc>Sequence diagram after Morris-II (arXiv:2403.02817). An attacker sends text carrying a payload to your agent, which stores it in memory, feeds it back to the model as context, and hands it to a peer agent, which stores it in turn. Red steps require no attacker.</desc>
<rect width="820" height="476" fill="#0D1119"/>
<defs>
<marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#E9EEF7"/></marker>
<marker id="b" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#FF4D5E"/></marker>
</defs>
<g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
<rect x="8" y="96" width="804" height="90" rx="4" fill="#E9EEF7" opacity=".035"/>
<rect x="8" y="196" width="804" height="126" rx="4" fill="#E9EEF7" opacity=".035"/>
<rect x="8" y="332" width="804" height="120" rx="4" fill="#E9EEF7" opacity=".035"/>
<text x="21" y="141" font-size="8" fill="#E9EEF7" opacity=".55" transform="rotate(-90 21 141)" text-anchor="middle" textLength="68" lengthAdjust="spacingAndGlyphs">INITIAL COMPROMISE</text>
<text x="21" y="259" font-size="8" fill="#E9EEF7" opacity=".55" transform="rotate(-90 21 259)" text-anchor="middle" textLength="104" lengthAdjust="spacingAndGlyphs">PROPAGATION — NEW TASK</text>
<text x="21" y="392" font-size="8" fill="#E9EEF7" opacity=".55" transform="rotate(-90 21 392)" text-anchor="middle" textLength="98" lengthAdjust="spacingAndGlyphs">PROPAGATION — REPLY</text>
<rect x="34" y="20" width="124" height="46" rx="5" fill="none" stroke="#FF4D5E" stroke-opacity=".8" stroke-width="1.4"/>
<text x="96" y="40" font-size="12" font-weight="700" text-anchor="middle" fill="#FF4D5E">Attacker</text>
<text x="96" y="56" font-size="9.5" text-anchor="middle" fill="#E9EEF7" opacity=".5">u1</text>
<line x1="96" y1="70" x2="96" y2="464" stroke="#E9EEF7" stroke-opacity=".22" stroke-dasharray="3 4"/>
<rect x="238" y="20" width="124" height="46" rx="5" fill="none" stroke="#E9EEF7" stroke-opacity=".45" stroke-width="1.4"/>
<text x="300" y="40" font-size="12" font-weight="700" text-anchor="middle" fill="#E9EEF7">Your agent</text>
<text x="300" y="56" font-size="9.5" text-anchor="middle" fill="#E9EEF7" opacity=".5">u2 · memory</text>
<line x1="300" y1="70" x2="300" y2="464" stroke="#E9EEF7" stroke-opacity=".22" stroke-dasharray="3 4"/>
<rect x="458" y="20" width="124" height="46" rx="5" fill="none" stroke="#E9EEF7" stroke-opacity=".45" stroke-width="1.4"/>
<text x="520" y="40" font-size="12" font-weight="700" text-anchor="middle" fill="#E9EEF7">The model</text>
<text x="520" y="56" font-size="9.5" text-anchor="middle" fill="#E9EEF7" opacity=".5">shared engine</text>
<line x1="520" y1="70" x2="520" y2="464" stroke="#E9EEF7" stroke-opacity=".22" stroke-dasharray="3 4"/>
<rect x="658" y="20" width="124" height="46" rx="5" fill="none" stroke="#E9EEF7" stroke-opacity=".45" stroke-width="1.4"/>
<text x="720" y="40" font-size="12" font-weight="700" text-anchor="middle" fill="#E9EEF7">Peer agent</text>
<text x="720" y="56" font-size="9.5" text-anchor="middle" fill="#E9EEF7" opacity=".5">u3 · memory</text>
<line x1="720" y1="70" x2="720" y2="464" stroke="#E9EEF7" stroke-opacity=".22" stroke-dasharray="3 4"/>
<line x1="96" y1="120" x2="300" y2="120" stroke="#FF4D5E" stroke-width="1.3" marker-end="url(#b)"/>
<text x="198" y="113" font-size="10" text-anchor="middle" fill="#FF4D5E">sends text carrying the payload</text>
<path d="M300 143 h30 v18 h-26" fill="none" stroke="#FF4D5E" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#b)"/>
<text x="340" y="140" font-size="10" fill="#FF4D5E">stored in memory — now a host</text>
<line x1="300" y1="222" x2="520" y2="222" stroke="#E9EEF7" stroke-width="1.3" marker-end="url(#a)" opacity=".7"/>
<text x="410" y="215" font-size="10" text-anchor="middle" fill="#E9EEF7" opacity=".7">retrieves its own notes as context</text>
<line x1="520" y1="254" x2="300" y2="254" stroke="#FF4D5E" stroke-width="1.3" marker-end="url(#b)"/>
<text x="410" y="247" font-size="10" text-anchor="middle" fill="#FF4D5E">output carries the payload forward</text>
<line x1="300" y1="286" x2="720" y2="286" stroke="#FF4D5E" stroke-width="1.3" marker-end="url(#b)"/>
<text x="510" y="279" font-size="10" text-anchor="middle" fill="#FF4D5E">hands off work to a peer</text>
<line x1="720" y1="358" x2="520" y2="358" stroke="#E9EEF7" stroke-width="1.3" marker-end="url(#a)" opacity=".7"/>
<text x="620" y="351" font-size="10" text-anchor="middle" fill="#E9EEF7" opacity=".7">peer answers using the poisoned context</text>
<line x1="520" y1="390" x2="720" y2="390" stroke="#FF4D5E" stroke-width="1.3" marker-end="url(#b)"/>
<text x="620" y="383" font-size="10" text-anchor="middle" fill="#FF4D5E">reply carries it again</text>
<path d="M720 413 h30 v18 h-26" fill="none" stroke="#FF4D5E" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#b)"/>
<text x="712" y="410" font-size="10" text-anchor="end" fill="#FF4D5E">stored — the loop is closed</text>
</g>
</svg>
