name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.10', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Corpus replay (false-positive gate)
        run: ./loop/replay.sh

  self-scan:
    # The tool must come up clean against its own repository. If our detection
    # rules fire on our own documentation, the rules are too greedy.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Scan self
        run: |
          python -m wormhole scan . --local-only --no-color \
            --fail-on high --blast-radius
