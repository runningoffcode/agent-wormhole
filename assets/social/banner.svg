<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" width="1500" height="500">
  <defs>
    <!-- Lens: bright throat right of centre, field falling away from it. -->
    <radialGradient id="glow" cx="66%" cy="44%" r="62%">
      <stop offset="0%"   stop-color="#4DD8E8" stop-opacity=".34"/>
      <stop offset="45%"  stop-color="#0E8FA3" stop-opacity=".14"/>
      <stop offset="100%" stop-color="#07090F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="counter" cx="16%" cy="92%" r="52%">
      <stop offset="0%"   stop-color="#0E8FA3" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#07090F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#4DD8E8" stop-opacity="0"/>
      <stop offset="45%"  stop-color="#4DD8E8" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#4DD8E8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1500" height="500" fill="#07090F"/>
  <rect width="1500" height="500" fill="url(#glow)"/>
  <rect width="1500" height="500" fill="url(#counter)"/>
  <rect width="1500" height="3" fill="url(#hair)"/>

  <!-- Mark. Centred vertically; X crops the top and bottom of a banner on
       some layouts, so nothing important sits near the edges. -->
  <g transform="translate(232 250) scale(3.05) translate(-32 -32)" fill="none" stroke="#4DD8E8">
    <circle cx="32" cy="32" r="30" stroke-width="2.5"/>
    <circle cx="33.59" cy="33.59" r="23.25" stroke-width="1.9"/>
    <circle cx="35.18" cy="35.18" r="17.5" stroke-width="1.7"/>
    <circle cx="36.95" cy="36.95" r="12.5" stroke-width="1.5"/>
    <circle cx="38.72" cy="38.72" r="8" stroke-width="1.3"/>
    <circle cx="41.02" cy="41.02" r="3.25" fill="#4DD8E8" stroke="none"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="400" y="222" font-size="76" font-weight="800" fill="#E9EEF7"
          letter-spacing="-2.4">Agent Wormhole</text>
    <text x="404" y="288" font-size="24" fill="#A3AEC2">
      Your agents talk to each other.
    </text>
    <text x="404" y="322" font-size="24" fill="#A3AEC2">
      Make sure they aren't passing something on.
    </text>
    <text x="404" y="376" font-size="19" fill="#67748A">
      <tspan fill="#4DD8E8">agentwormhole.com</tspan><tspan xml:space="preserve">    ·    open source    ·    no telemetry</tspan>
    </text>
  </g>
</svg>
