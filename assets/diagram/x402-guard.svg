<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 620" width="820" height="620" role="img" aria-label="How wormhole-x402 checks a payment against the quote">
<title>wormhole-x402 — is this the transaction that was asked for?</title>
<desc>Two channels converge on one comparison. The x402 quote arrives in the server's HTTP 402 response, on a channel the model never touches, before the transaction exists. The transaction bytes are authored inside the model's context and are assumed hostile. The merchant's token account derives deterministically from the quote — pure math, no lookup, no chain state — and signing refuses any transaction that does not match.</desc>
<rect width="820" height="620" fill="#0D1119"/>
<defs>
<marker id="ma" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#4DD8E8"/></marker>
<marker id="mb" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#FF4D5E"/></marker>
<marker id="mc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#E9EEF7"/></marker>
</defs>
<g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">

<!-- channel bands -->
<rect x="8" y="14" width="396" height="316" rx="4" fill="#4DD8E8" opacity=".03"/>
<rect x="416" y="14" width="396" height="316" rx="4" fill="#FF4D5E" opacity=".03"/>
<text x="206" y="34" font-size="9" text-anchor="middle" fill="#4DD8E8" opacity=".75" letter-spacing="3">THE CHANNEL THE MODEL NEVER TOUCHES</text>
<text x="614" y="34" font-size="9" text-anchor="middle" fill="#FF4D5E" opacity=".7" letter-spacing="3">AUTHORED IN THE MODEL'S CONTEXT</text>

<!-- left: server / quote -->
<rect x="96" y="52" width="220" height="46" rx="5" fill="none" stroke="#4DD8E8" stroke-opacity=".7" stroke-width="1.4"/>
<text x="206" y="72" font-size="12" font-weight="700" text-anchor="middle" fill="#4DD8E8">Server</text>
<text x="206" y="88" font-size="9.5" text-anchor="middle" fill="#E9EEF7" opacity=".5">HTTP 402 · before the tx exists</text>

<line x1="206" y1="98" x2="206" y2="128" stroke="#4DD8E8" stroke-width="1.3" marker-end="url(#ma)"/>

<rect x="96" y="132" width="220" height="88" rx="5" fill="#4DD8E8" opacity=".05"/>
<rect x="96" y="132" width="220" height="88" rx="5" fill="none" stroke="#4DD8E8" stroke-opacity=".45" stroke-width="1.2"/>
<text x="112" y="154" font-size="10.5" fill="#E9EEF7" opacity=".85">the quote</text>
<text x="112" y="176" font-size="10" fill="#4DD8E8">payTo:   merchant M</text>
<text x="112" y="192" font-size="10" fill="#4DD8E8">asset:   USDC mint</text>
<text x="112" y="208" font-size="10" fill="#4DD8E8">amount:  1&#8202;000&#8202;000</text>

<line x1="206" y1="220" x2="206" y2="250" stroke="#4DD8E8" stroke-width="1.3" marker-end="url(#ma)"/>

<rect x="96" y="254" width="220" height="70" rx="5" fill="none" stroke="#E9EEF7" stroke-opacity=".4" stroke-width="1.2"/>
<text x="112" y="276" font-size="10.5" font-weight="700" fill="#E9EEF7">derive token account</text>
<text x="112" y="294" font-size="9.5" fill="#E9EEF7" opacity=".6">hash(merchant M, mint) — pure math</text>
<text x="112" y="310" font-size="9.5" fill="#E9EEF7" opacity=".6">no lookup · no RPC · no chain state</text>

<!-- right: agent / tx -->
<rect x="504" y="52" width="220" height="46" rx="5" fill="none" stroke="#E9EEF7" stroke-opacity=".45" stroke-width="1.4"/>
<text x="614" y="72" font-size="12" font-weight="700" text-anchor="middle" fill="#E9EEF7">Your agent</text>
<text x="614" y="88" font-size="9.5" text-anchor="middle" fill="#E9EEF7" opacity=".5">reads pages · may be a host</text>

<line x1="614" y1="98" x2="614" y2="128" stroke="#FF4D5E" stroke-width="1.3" marker-end="url(#mb)"/>

<rect x="504" y="132" width="220" height="88" rx="5" fill="#FF4D5E" opacity=".04"/>
<rect x="504" y="132" width="220" height="88" rx="5" fill="none" stroke="#FF4D5E" stroke-opacity=".4" stroke-width="1.2"/>
<text x="520" y="154" font-size="10.5" fill="#E9EEF7" opacity=".85">unsigned transaction bytes</text>
<text x="520" y="176" font-size="10" fill="#E9EEF7" opacity=".65">built from whatever the model</text>
<text x="520" y="192" font-size="10" fill="#E9EEF7" opacity=".65">believed — including anything a</text>
<text x="520" y="208" font-size="10" fill="#FF4D5E">poisoned page told it to believe</text>

<line x1="614" y1="220" x2="614" y2="250" stroke="#FF4D5E" stroke-width="1.3" marker-end="url(#mb)"/>
<text x="632" y="240" font-size="9.5" fill="#E9EEF7" opacity=".5">about to be signed</text>

<!-- converge into compare -->
<path d="M206 324 v22 h204" fill="none" stroke="#4DD8E8" stroke-width="1.3"/>
<line x1="410" y1="346" x2="410" y2="368" stroke="#4DD8E8" stroke-width="1.3" marker-end="url(#ma)"/>
<path d="M614 254 v92 h-204" fill="none" stroke="#FF4D5E" stroke-width="1.3" opacity=".9"/>
<text x="398" y="362" font-size="9.5" text-anchor="end" fill="#E9EEF7" opacity=".55">expected destination = FaBDLVfa…</text>

<rect x="250" y="372" width="320" height="44" rx="5" fill="#E9EEF7" opacity=".05"/>
<rect x="250" y="372" width="320" height="44" rx="5" fill="none" stroke="#E9EEF7" stroke-opacity=".55" stroke-width="1.4"/>
<text x="410" y="392" font-size="12" font-weight="700" text-anchor="middle" fill="#E9EEF7">compare</text>
<text x="410" y="407" font-size="9" text-anchor="middle" fill="#E9EEF7" opacity=".55">destination · mint · amount · no extra authority</text>

<line x1="410" y1="416" x2="410" y2="444" stroke="#E9EEF7" stroke-opacity=".6" stroke-width="1.3" marker-end="url(#mc)"/>

<!-- verdicts -->
<rect x="60" y="448" width="700" height="126" rx="5" fill="#E9EEF7" opacity=".035"/>
<g font-size="10.5">
<rect x="80" y="462" width="58" height="19" rx="4" fill="#35D69B"/>
<text x="109" y="475.5" font-size="10" font-weight="700" text-anchor="middle" fill="#0D1119">ALLOW</text>
<text x="152" y="475.5" fill="#E9EEF7" opacity=".85">transfer 1 USDC &#8594; FaBDLVfa…  — the quoted merchant, the quoted amount</text>

<rect x="80" y="490" width="58" height="19" rx="4" fill="#FF4D5E"/>
<text x="109" y="503.5" font-size="10" font-weight="700" text-anchor="middle" fill="#0D1119">REFUSE</text>
<text x="152" y="503.5" fill="#E9EEF7" opacity=".85">transfer 1 USDC &#8594; 9xKp2Qm…</text>
<text x="740" y="503.5" text-anchor="end" fill="#FF4D5E">X402-001 · wrong destination</text>

<rect x="80" y="518" width="58" height="19" rx="4" fill="#FF4D5E"/>
<text x="109" y="531.5" font-size="10" font-weight="700" text-anchor="middle" fill="#0D1119">REFUSE</text>
<text x="152" y="531.5" fill="#E9EEF7" opacity=".85">transfer 900 USDC &#8594; FaBDLVfa…</text>
<text x="740" y="531.5" text-anchor="end" fill="#FF4D5E">X402-002 · wrong amount</text>

<rect x="80" y="546" width="58" height="19" rx="4" fill="#FF4D5E"/>
<text x="109" y="559.5" font-size="10" font-weight="700" text-anchor="middle" fill="#0D1119">REFUSE</text>
<text x="152" y="559.5" fill="#E9EEF7" opacity=".85">correct payment + Approve instruction</text>
<text x="740" y="559.5" text-anchor="end" fill="#FF4D5E">X402-006 · delegates authority</text>
</g>

<!-- footer -->
<text x="410" y="602" font-size="10.5" text-anchor="middle" fill="#E9EEF7" opacity=".65">simulation asks &#8220;what will this do&#8221; &#8202;&#8212;&#8202; this asks <tspan fill="#4DD8E8" opacity="1">&#8220;is this what was asked for&#8221;</tspan></text>
</g>
</svg>
