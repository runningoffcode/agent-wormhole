# The same scan via the bundled composite action, which is the shorter path if
# you do not need SARIF.
#
# Copy to .github/workflows/agent-config-scan.yml.
#
# IMPORTANT: this action does NOT produce SARIF. It runs the scan and writes
# the text output to the job summary. If you want inline annotations on the
# pull request, use agent-config-scan.yml in this directory instead — it calls
# the CLI directly and uploads SARIF.

name: agent-config-scan

on:
  pull_request:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The action checks out its own copy of the scanner and puts it on
      # PYTHONPATH, so there is no pip install step here.
      #
      # AW-59. Pin to a commit SHA, never to `@main` or a `@v1` tag. A tag or
      # branch is a mutable pointer: whoever can move it decides what runs in
      # your CI, and this action runs with your runner's token and your
      # checked-out source.
      #
      # The placeholder below is deliberate and the release process must
      # replace it. A SHA here would be worse than a hole: the only commits
      # that exist right now predate the AW-81 input-injection fix, so pinning
      # to one would publish a working example that tells every consumer to
      # run the injectable version of this action. An unfillable placeholder
      # fails loudly; a stale-but-plausible SHA fails silently, in the
      # consumer's CI, with the gate green.
      #
      # tests/test_ci_hardening.py::TestConsumerExamplePinning resolves this
      # pin against the repository and fails unless the commit it names
      # actually contains the hardened action.yml — so this cannot be filled
      # in with any 40 hex characters, and cannot be left unfilled at release.
      - uses: runningoffcode/agent-wormhole@REPLACE_WITH_RELEASE_COMMIT_SHA # see note above
        with:
          path: '.'
          fail-on: 'high'
          blast-radius: 'true'
          local-only: 'true'
