[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
# `agent-wormhole` on PyPI belongs to an unrelated project, and PyPI collapses
# hyphens when comparing names, so `agentwormhole` is rejected as too similar
# to it. The distribution is `wormhole-guard`; the import package and the
# console script both stay `wormhole`, so nothing the operator types changes.
name = "wormhole-guard"
version = "0.1.2"
description = "Stop self-replicating prompt payloads from spreading between AI agents"
readme = "README.md"
requires-python = ">=3.8"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "JuicyD3v" }]
keywords = [
  "ai-security",
  "prompt-injection",
  "llm-agents",
  "agent-security",
  "supply-chain",
  "claude-code",
  "mcp",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/runningoffcode/agent-wormhole"
Repository = "https://github.com/runningoffcode/agent-wormhole"
Issues = "https://github.com/runningoffcode/agent-wormhole/issues"
Changelog = "https://github.com/runningoffcode/agent-wormhole/releases"

[project.scripts]
wormhole = "wormhole.cli:main"

[tool.setuptools.packages.find]
include = ["wormhole*"]
