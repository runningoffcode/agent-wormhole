<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <radialGradient id="pg-glow" cx="30%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#4DD8E8" stop-opacity=".28"/>
      <stop offset="50%" stop-color="#0E8FA3" stop-opacity=".10"/>
      <stop offset="100%" stop-color="#07090F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pg-counter" cx="88%" cy="90%" r="50%">
      <stop offset="0%" stop-color="#0E8FA3" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#07090F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pg-hair" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4DD8E8" stop-opacity="0"/>
      <stop offset="45%" stop-color="#4DD8E8" stop-opacity=".7"/>
      <stop offset="100%" stop-color="#4DD8E8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="#07090F"/>
  <rect width="1280" height="640" fill="url(#pg-glow)"/>
  <rect width="1280" height="640" fill="url(#pg-counter)"/>

  <!-- the mark: lensed ring field, drawn large on the left -->
  <g transform="translate(232,320) scale(4.6)" fill="none" stroke="#4DD8E8">
    <circle cx="0" cy="0" r="30" stroke-width="2.5"/>
    <circle cx="1.59" cy="1.59" r="23.25" stroke-width="1.9"/>
    <circle cx="3.18" cy="3.18" r="17.5" stroke-width="1.7"/>
    <circle cx="4.95" cy="4.95" r="12.5" stroke-width="1.5"/>
    <circle cx="6.72" cy="6.72" r="8" stroke-width="1.3"/>
    <circle cx="9.02" cy="9.02" r="3.25" fill="#4DD8E8" stroke="none"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="470" y="268" font-size="64" font-weight="800" letter-spacing="1" fill="#E9EEF7">AGENT WORMHOLE</text>

    <text x="472" y="330" font-size="25" fill="#A3AEC2">Your agents talk to each other.</text>
    <text x="472" y="366" font-size="25" fill="#A3AEC2">Make sure they aren&#8217;t passing something on.</text>

    <rect x="472" y="404" width="470" height="46" rx="10" fill="#0D1119" stroke="#1E2534" stroke-width="1.5"/>
    <text x="492" y="434" font-size="21" fill="#4DD8E8">$ <tspan fill="#E9EEF7">pipx install wormhole-guard</tspan></text>

    <text x="472" y="500" font-size="20" letter-spacing="2" fill="#67748A">OPEN SOURCE · 100% LOCAL · NO TELEMETRY</text>
  </g>

  <rect x="240" y="576" width="800" height="1.5" fill="url(#pg-hair)"/>
  <text x="640" y="612" font-size="20" letter-spacing="3" text-anchor="middle" fill="#4DD8E8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">AGENTWORMHOLE.COM</text>
</svg>
