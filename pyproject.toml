[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "quarantine-agent"
version = "0.1.0"
description = "Detect self-replicating prompt payloads and permission overreach in AI agent configurations"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
keywords = ["ai-security", "prompt-injection", "llm-agents", "agent-security", "supply-chain"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/runningoffcode/quarantine"
Issues = "https://github.com/runningoffcode/quarantine/issues"

[project.scripts]
quarantine = "quarantine.cli:main"

[tool.setuptools.packages.find]
include = ["quarantine*"]
