<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Agent Wormhole">
  <title>Agent Wormhole</title>
  <!-- The liquid-glass badge: white Lensed Field mark inside a translucent
       dark disc with the site's gradient glass ring. Self-contained — reads
       correctly on any background, designed for dark surfaces. -->
  <defs>
    <radialGradient id="disc" cx="50%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#1e2026" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0a0b0e" stop-opacity="0.82"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.5"/>
      <stop offset="0.25" stop-color="#fff" stop-opacity="0.12"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.03"/>
      <stop offset="0.75" stop-color="#fff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.45"/>
    </linearGradient>
    <radialGradient id="sheen" cx="50%" cy="0%" r="85%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.14"/>
      <stop offset="50%" stop-color="#fff" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="64" cy="64" r="62" fill="url(#disc)"/>
  <circle cx="64" cy="64" r="62" fill="url(#sheen)"/>
  <circle cx="64" cy="64" r="61.1" fill="none" stroke="url(#ring)" stroke-width="1.8"/>
  <g fill="none" stroke="#fff" transform="translate(30.72, 30.72) scale(1.04)">
    <circle cx="32" cy="32" r="30" stroke-width="2.5"/>
    <circle cx="33.59" cy="33.59" r="23.25" stroke-width="1.9"/>
    <circle cx="35.18" cy="35.18" r="17.5" stroke-width="1.7"/>
    <circle cx="36.95" cy="36.95" r="12.5" stroke-width="1.5"/>
    <circle cx="38.72" cy="38.72" r="8" stroke-width="1.3"/>
    <circle cx="41.02" cy="41.02" r="3.25" fill="#fff" stroke="none"/>
  </g>
</svg>
